kind = "mobile"
previewPath = "/lingua-mobile/"
title = "Lingua Mobile"
version = "1.0.0"
id = "artifacts/lingua-mobile"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/"
name = "expo"
paths = [ "/lingua-mobile/" ]
localPort = 25354

[services.development]
run = "pnpm --filter @workspace/lingua-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/lingua-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/lingua-mobile", "run", "serve" ]

[services.env]
PORT = "25354"
BASE_PATH = "/lingua-mobile/"
