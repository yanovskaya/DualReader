<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Lingua — двуязычный ридер</title>
    <meta name="description" content="Читайте английские книги по методу Ильи Франка: оригинальный текст с параллельным переводом на русский и встроенным словарём." />

    <!-- PWA -->
    <meta name="application-name" content="Lingua" />
    <meta name="theme-color" content="#059669" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Lingua" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Social / OG -->
    <meta property="og:title" content="Lingua — двуязычный ридер" />
    <meta property="og:description" content="Читайте по методу Ильи Франка: английский текст с синхронным переводом" />
    <meta property="og:image" content="/opengraph.jpg" />
    <meta property="og:type" content="website" />

  </head>
  <body>
    <script>
      (function () {
        var VERSION = '2026-05-16-offline';
        var key = 'lingua-sw-version';
        var prev = null;
        try { prev = localStorage.getItem(key); } catch(e) {}
        if (prev !== VERSION) {
          try { localStorage.setItem(key, VERSION); } catch(e) {}
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              regs.forEach(function (r) { r.unregister(); });
            });
          }
          if ('caches' in window) {
            caches.keys().then(function (keys) {
              keys.forEach(function (k) { caches.delete(k); });
            });
          }
          if (prev !== null) {
            setTimeout(function () { location.reload(); }, 50);
          }
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
