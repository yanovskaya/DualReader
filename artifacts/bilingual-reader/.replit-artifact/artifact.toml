kind = "web"
previewPath = "/"
title = "Bilingual Reader"
version = "1.0.0"
id = "artifacts/bilingual-reader"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23576

[services.development]
run = "pnpm --filter @workspace/bilingual-reader run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/bilingual-reader", "run", "build" ]
publicDir = "artifacts/bilingual-reader/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23576"
BASE_PATH = "/"
